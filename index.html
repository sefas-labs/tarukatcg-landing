<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Taruka Lounge TCG</title>
        <meta
            name="description"
            content="Taruka Lounge TCG. La tienda online está en pausa por un tiempo; escríbenos por WhatsApp o síguenos en redes."
        />
        <meta name="theme-color" content="#0b0b0d" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="icon" href="/favicon.png" type="image/png" />
        <style>
            :root {
                color-scheme: dark;
                --surface: #0b0b0d;
                --surface-raised: #161619;
                --line: rgb(255 255 255 / 0.08);
                --fg: #f4f4f5;
                --fg-muted: #a1a1aa;
                --accent: #d9ae42;
                --accent-hover: #e3bd55;
                --whatsapp: #25d366;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                min-height: 100%;
            }
            body {
                min-height: 100vh;
                min-height: 100dvh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem 1rem;
                font-family:
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    Ubuntu,
                    sans-serif;
                line-height: 1.6;
                color: var(--fg);
                background:
                    radial-gradient(ellipse 90% 60% at 50% -10%, rgb(217 174 66 / 0.14), transparent 70%),
                    var(--surface);
            }
            main {
                width: 100%;
                max-width: 30rem;
                text-align: center;
                padding: 2.5rem 1.5rem;
                background: var(--surface-raised);
                border: 1px solid var(--line);
                border-radius: 1.25rem;
                box-shadow: 0 20px 60px rgb(0 0 0 / 0.45);
            }
            .logo {
                width: 10rem;
                height: 10rem;
                margin: 0 auto 1rem;
                display: block;
            }
            .badge {
                display: inline-block;
                margin-bottom: 1rem;
                padding: 0.3rem 0.7rem;
                font-size: 0.7rem;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--accent);
                border: 1px solid rgb(217 174 66 / 0.35);
                border-radius: 999px;
            }
            h1 {
                margin: 0 0 0.75rem;
                font-size: clamp(1.5rem, 5vw, 1.9rem);
                font-weight: 700;
                letter-spacing: -0.02em;
                text-wrap: balance;
            }
            p {
                margin: 0 0 1.75rem;
                color: var(--fg-muted);
                text-wrap: pretty;
            }
            .whatsapp {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 0.6rem;
                width: 100%;
                min-height: 3rem;
                padding: 0.75rem 1.25rem;
                font-size: 1rem;
                font-weight: 600;
                color: #0b0b0d;
                text-decoration: none;
                background: var(--whatsapp);
                border-radius: 0.75rem;
                transition: filter 0.15s ease;
            }
            .whatsapp:hover {
                filter: brightness(1.08);
            }
            .whatsapp svg {
                width: 1.35rem;
                height: 1.35rem;
                flex: none;
            }
            .social {
                display: flex;
                justify-content: center;
                gap: 0.75rem;
                margin: 1.5rem 0 0;
                padding: 0;
                list-style: none;
            }
            .social:empty {
                display: none;
            }
            .social a {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 2.75rem;
                height: 2.75rem;
                color: var(--fg-muted);
                border: 1px solid var(--line);
                border-radius: 999px;
                transition:
                    color 0.15s ease,
                    border-color 0.15s ease;
            }
            .social a:hover {
                color: var(--accent);
                border-color: rgb(217 174 66 / 0.5);
            }
            .social svg {
                width: 1.25rem;
                height: 1.25rem;
            }
            a:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 3px;
            }
            footer {
                margin-top: 2rem;
                font-size: 0.8rem;
                color: var(--fg-muted);
            }
        </style>
    </head>
    <body>

</html>
